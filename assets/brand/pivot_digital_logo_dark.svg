<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="600" height="140" fill="none">
  <defs>
    <linearGradient id="pivotDarkGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="pivotDarkGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="pivotDarkStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- LOGO EMBLEM (Left side) -->
  <g transform="translate(10, 10)">
    <!-- Base Book Spine & Left Page -->
    <path d="M 60 95 C 40 92 22 84 10 75 L 10 32 C 22 41 40 48 60 50 Z" 
          fill="url(#pivotDarkGrad2)" opacity="0.95" />
    
    <!-- Right Page (Lifting / Pivoting) -->
    <path d="M 60 95 C 80 92 98 84 110 75 L 110 32 C 98 41 80 48 60 50 Z" 
          fill="url(#pivotDarkGrad1)" opacity="0.9" />

    <!-- Center Turning Page (The 'Pivot' Leaf) -->
    <path d="M 60 95 C 60 65 72 35 92 18 C 72 26 60 48 60 95 Z" 
          fill="#E0F2FE" opacity="0.9" />
    
    <!-- Dynamic Pivot Arch / Digital Sweep -->
    <path d="M 28 36 C 45 15 78 8 102 24 C 95 24 82 23 72 28 C 52 38 40 58 36 78 C 30 64 28 50 28 36 Z" 
          fill="url(#pivotDarkGrad1)" opacity="0.85" />

    <!-- Educational Catalyst Star (Top Right of Pivot) -->
    <path d="M 104 18 L 107 26 L 115 27 L 109 33 L 111 41 L 104 36 L 97 41 L 99 33 L 93 27 L 101 26 Z" 
          fill="url(#pivotDarkStar)" />

    <!-- Small Digital Accent Dot -->
    <circle cx="82" cy="12" r="3.5" fill="#38BDF8" />
    <circle cx="68" cy="8" r="2.5" fill="#93C5FD" />
  </g>

  <!-- TYPOGRAPHY (Right side) -->
  <g transform="translate(145, 0)">
    <!-- Small Top Label: THE -->
    <text x="0" y="44" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="14" 
          font-weight="700" 
          letter-spacing="5" 
          fill="#38BDF8">
      THE
    </text>

    <!-- Main Name: PIVOT DIGITAL -->
    <text x="0" y="82" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="36" 
          font-weight="900" 
          letter-spacing="1" 
          fill="#FFFFFF">
      PIVOT <tspan fill="#60A5FA">DIGITAL</tspan>
    </text>

    <!-- Subtitle: PUBLICATION -->
    <text x="2" y="108" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="13" 
          font-weight="600" 
          letter-spacing="7" 
          fill="#94A3B8">
      PUBLICATION
    </text>
  </g>
</svg>
